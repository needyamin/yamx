# Optional: create .env from .env.example to override OLLAMA_MODEL (see README).
services:
  # The Ollama local AI provider
  ollama:
    image: ollama/ollama:latest
    pull_policy: always
    container_name: yamx_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 15s
      retries: 24
      start_period: 25s

  # One-shot: pull model into the ollama service (must use http:// in OLLAMA_HOST for CLI).
  # The ollama image ENTRYPOINT is `ollama`; override so we run a shell script (not `ollama sh …`).
  ollama-init:
    image: ollama/ollama:latest
    pull_policy: always
    container_name: yamx_ollama_init
    entrypoint: ["/bin/sh"]
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./ollama-pull.sh:/ollama-pull.sh:ro
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:3b}
      # Optional tuning (set in .env next to this file): more retries / longer sleep for flaky networks.
      - OLLAMA_INIT_START_DELAY=${OLLAMA_INIT_START_DELAY:-5}
      - OLLAMA_INIT_PULL_RETRIES=${OLLAMA_INIT_PULL_RETRIES:-8}
      - OLLAMA_INIT_PULL_RETRY_SECONDS=${OLLAMA_INIT_PULL_RETRY_SECONDS:-30}
    command: ["/ollama-pull.sh"]

  # The YamX Web interface in Full Power Mode
  yamx-web:
    build:
      context: ../../
      dockerfile: docs/docker/Dockerfile
    container_name: yamx_web
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "8765:8765"
    environment:
      # Same model tag as ollama-init (override with OLLAMA_MODEL in .env).
      - DEFAULT_PROVIDER=openai
      - DEFAULT_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:3b}
      - OPENAI_API_KEY=ollama
      - OPENAI_BASE_URL=http://ollama:11434/v1
      - YAMX_PROVIDER=openai
      - YAMX_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:3b}
      - YAMX_OPENAI_API_KEY=ollama
      - YAMX_OPENAI_BASE_URL=http://ollama:11434/v1

      - YAMX_INTELLIGENCE_LEVEL=top
      - YAMX_AUTO_APPROVE=true

    command: ["web", "--host", "0.0.0.0", "--port", "8765", "--allow-dangerous"]
    volumes:
      - yamx_data:/root/.yamx
      - ../../:/workspace
    working_dir: /workspace

volumes:
  ollama_data:
  yamx_data:
