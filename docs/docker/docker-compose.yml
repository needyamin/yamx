# Optional: create .env from .env.example to override OLLAMA_MODEL (see README).
services:
  # The Ollama local AI provider
  ollama:
    image: ollama/ollama:latest
    pull_policy: missing
    container_name: yamx_ollama
    environment:
      # Low-memory server tuning (good for small VPS / RAM-limited hosts).
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-16}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-1024}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-0}
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 15s
      retries: 24
      start_period: 25s

  # One-shot: pull model into the ollama service (must use http:// in OLLAMA_HOST for CLI).
  # Share ollama's network stack so we hit 127.0.0.1:11434 (avoids DNS / cross-container pull quirks).
  # The ollama image ENTRYPOINT is `ollama`; override so we run a shell script (not `ollama sh …`).
  ollama-init:
    image: ollama/ollama:latest
    pull_policy: missing
    container_name: yamx_ollama_init
    network_mode: service:ollama
    entrypoint: ["/bin/sh"]
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./ollama-pull.sh:/ollama-pull.sh:ro
    environment:
      - OLLAMA_HOST=http://127.0.0.1:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:0.5b}
      # Optional tuning (set in .env next to this file): more retries / longer sleep for flaky networks.
      - OLLAMA_INIT_START_DELAY=${OLLAMA_INIT_START_DELAY:-5}
      - OLLAMA_INIT_PULL_RETRIES=${OLLAMA_INIT_PULL_RETRIES:-8}
      - OLLAMA_INIT_PULL_RETRY_SECONDS=${OLLAMA_INIT_PULL_RETRY_SECONDS:-30}
    command: ["/ollama-pull.sh"]

  # The YamX Web interface in Full Power Mode
  yamx-web:
    build:
      context: ../../
      dockerfile: docs/docker/Dockerfile
    container_name: yamx_web
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "8765:8765"
    environment:
      # Same model tag as ollama-init (override with OLLAMA_MODEL in .env).
      - DEFAULT_PROVIDER=openai
      - DEFAULT_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:0.5b}
      - OPENAI_API_KEY=ollama
      - OPENAI_BASE_URL=http://ollama:11434/v1
      # YamX low-memory context strategy: summarize early and roll to lightweight next-turn context.
      - YAMX_CONTEXT_BUDGET_CHARS=${YAMX_CONTEXT_BUDGET_CHARS:-50000}
      - YAMX_CONTEXT_KEEP_LAST_MESSAGES=${YAMX_CONTEXT_KEEP_LAST_MESSAGES:-6}
      - YAMX_CONTEXT_ROLLOVER_MODE=${YAMX_CONTEXT_ROLLOVER_MODE:-summary-next-session}
      # Required for internet-facing deployment (HTTP Basic auth).
      - YAMX_WEB_USERNAME=${YAMX_WEB_USERNAME:?Set YAMX_WEB_USERNAME in .env}
      - YAMX_WEB_PASSWORD=${YAMX_WEB_PASSWORD:?Set YAMX_WEB_PASSWORD in .env}
      - YAMX_WEB_AUTH_REALM=${YAMX_WEB_AUTH_REALM:-YamX Web}

      - YAMX_INTELLIGENCE_LEVEL=top
      - YAMX_AUTO_APPROVE=true

    command: ["web", "--host", "0.0.0.0", "--port", "8765", "--allow-dangerous"]
    volumes:
      - yamx_data:/root/.yamx
      - ../../:/workspace
    working_dir: /workspace

volumes:
  ollama_data:
  yamx_data:
